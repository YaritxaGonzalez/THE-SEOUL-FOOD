<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Seoul Food</title>
    <link rel="stylesheet" href="/styles/estilos.css">
    <link rel="icon" type="image/png" href="/imagenes/store-front.png">
</head>
<body>
    <header id="header"></header>
    <main id="content">
        <article id="inicio">
            <h1>The Seoul Food</h1>
            <p>Los mejores ramyeon y snacks coreanos, directo a tu puerta.</p>
        </article>
 
        <article id="productos">
            <h2 class="titulo-seccion">Nuestros productos</h2>
            <div class="contenedor">
                <div class="caluga">
                    <span class="nombre">또 다른 닭고기 수프</span>
                    <img src="imagenes/Samyang-Buldak-Bokkeum-Myeon-Ramyeon-1.webp" alt="Buldak Ramyeon- fideos picantes coreanos">
                    <span class="precio">Precio: Mucho caro</span>
                    <button class="button">Agregar</button>
                </div>
 
                <div class="caluga">
                    <span class="nombre">닭고기 수프</span>
                    <img src="imagenes/Samyang-Buldak-Quattro-Cheese.webp" alt="Buldak Queso - fideos picantes coreanos sabor queso">
                    <span class="precio">Precio: Mucho caro</span>
                    <button class="button">Agregar</button>
                </div>
            </div>
        </article>
    </main>
 
    <input type="text">
    <input type="password">
    <input type="email">
    <input type="number">
    <input type="image">
    <input type="checkbox">
    <input type="color">
    <input type="button">
    <input type="date">
    <input type="hidden">
    <input type="week">
    <input type="month">
    <input type="datetime-local">
    <input type="time">
    <input type="submit">
    <input type="reset">
    <footer id="footer"></footer>
</body>
<script src="/scripts/scripts.js"></script>
</html>
