<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse - The Seoul Food</title>
    <link rel="stylesheet" href="../styles/estilos.css">
    <link rel="stylesheet" href="/scripts/matriz.js">
    <link rel="stylesheet" href="/styles/estiloMatriz.css">
    <script src="https://unpkg.com/boxicons@2.1.4/dist/boxicons.js"></script>
</head>
<body>


    <section id="content">
        <article class="form-card">
            <h1>Crear cuenta</h1>
            <p>Registrate para pedir tus ramyeon favoritos.</p>

            <form id="formRegistro">
                <input type="text" id="nombre" placeholder="Nombre completo" required>
                <span id="errorNombre" class="mensaje-error hidden">El nombre solo puede contener letras y espacios (mínimo 2 caracteres).</span>

                <input type="email" placeholder="Correo electrónico" required>
                <input type="tel" placeholder="Teléfono" required>
                <input type="password" placeholder="Contraseña" required>
                <input type="password" placeholder="Confirmar contraseña" required>

                <button type="submit" class="btn-registro">Registrarse</button>            
            </form>
            <p id="mensajeExito" class="mensaje-exito hidden">✅ ¡Registro exitoso! Redirigiendo al inicio...</p>
        </article>
    </section>

    <footer id="footer"></footer>
    <script src="../scripts/matriz.js"></script>
    <script src="scripts/scripts.js"></script>
</body>
</html>
