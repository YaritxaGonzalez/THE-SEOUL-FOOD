<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <title>Inicio Sesion - The Seoul Food</title>
    <link rel="stylesheet" href="../styles/estilos.css">

<body>

    <header id="header"></header>

            <form>

                <a href="../index.html" class="btn-registro btn-volver">Volver al inicio</a>
            </form>
            <p class="link-secundario">
                ¿No tienes cuenta? <a href="registrarse.html">Regístrate</a>
            </p>
        </article>
    </section>

    <footer id="footer"></footer>

    <script src="../scripts/matriz.js"></script>
    <script src="scripts/cuantas_sesiones"></script>
