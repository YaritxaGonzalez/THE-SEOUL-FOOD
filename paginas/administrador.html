<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styles/estilos.css">
    <link rel="stylesheet" href="../styles/estiloAdmin.css">
    <link rel="icon" type="image/png" href="../imagenes/store-front.png">
    <link rel="stylesheet" href="../styles/estiloMatriz.css">
    <script src="https://unpkg.com/boxicons@2.1.4/dist/boxicons.js"></script>
    <title>Administracion - The Seoul Food</title>
</head>
<body>

    <header id="header"></header>

    <section id="content" class="admin-panel">
        <h1>Panel de administración</h1>

        <!-- Pestaña: Stock (tabla de productos existentes) -->
        <article id="tabStock" class="admin-tab">
            <table class="tabla-admin">
                <thead>
                    <tr>
                        <th>Imagen</th>
                        <th>Nombre</th>
                        <th>Precio</th>
                        <th>Stock</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="listaProductosAdmin"></tbody>
            </table>
        </article>

        <!-- Pestaña: Producto (formulario) -->
        <article id="tabProducto" class="admin-tab oculto">
            <div class="form-card">
                <h2>Producto</h2>
                <form id="formNuevoProducto">
                    <input type="text" id="nuevoNombre" placeholder="Nombre del producto" required>
                    <input type="text" id="nuevoImagen" placeholder="Ruta de la imagen (ej: imagenes/nuevo.webp)" required>
                    <input type="number" id="nuevoPrecio" placeholder="Precio" min="0" required>
                    <input type="number" id="nuevoStock" placeholder="Stock" min="0" required>
                    <input type="text" id="nuevoDescripcion" placeholder="Descripción">
                    <button type="submit" class="btn-registro">Agregar producto</button>
                </form>
            </div>
        </article>
    </section>

    <footer id="footer"></footer>

    <script src="../scripts/productos.js"></script>
    <script src="../scripts/matriz.js"></script>
    <script src="../scripts/scripts.js"></script>
    <script src="../scripts/cuantas_sesiones.js"></script>
    <script src="../scripts/admin.js"></script>
</body>
</html>
